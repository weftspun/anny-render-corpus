name: Checks

# WHY THIS EXISTS. This repository had no CI at all: 61 Python files, sixteen gates, every
# one run by hand. That is how OpenUSD went undeclared long enough for two gates to be
# unrunnable on every desk while still reading as coverage in the file list.
#
# CONTROLS ONLY, AND DELIBERATELY. Every job below runs `--self-test`, which is the question
# CI can answer: can this gate still reject the input it exists to reject. The gates that
# measure the corpus need the corpus, and the corpus is not in the repository -- running
# them here would report green for a check that never ran, which is rule 3's silent skip.
# `check_published.py` is the same case for a different reason: it needs a hub token.
#
# One job per environment rather than one job running everything, because the environments
# are `no-default-feature` and mutually exclusive on purpose: the renderer is pinned to one
# Mitsuba and must not move because a parquet library did.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  usd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: usd
      # The gate for rule 6, and the archive gate. Both were unrunnable until usd-core was
      # declared; the fixture is committed so the negative controls have a rig to break.
      - run: pixi run -e usd python check_conventions.py fixtures-conventions.usda --self-test
      - run: pixi run -e usd python check_anime_materials.py --self-test
      - run: pixi run -e usd python check_anime_materials.py anime_materials.usda
      - run: pixi run -e usd python usda_to_obj.py --self-test
      - run: pixi run -e usd python make_conventions_fixture.py --self-test

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: corpus
      - run: pixi run -e corpus python anny_render_schema.py

  anny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: anny
      - run: pixi run -e anny python check_readme_claims.py --self-test
      - run: pixi run -e anny python check_facial_actions.py --self-test
      - run: pixi run -e anny python check_published.py --self-test
      - run: pixi run -e anny python check_view_selection.py
      - run: pixi run -e anny python check_corpus_model.py --self-test

  # THE README'S OWN NUMBERS, WHICH IS THE CLAIM THIS REPOSITORY OPENS WITH.
  #
  # Not gating on the exit code. Two claims need the `corpus` environment and one is answered
  # from `claim-cache.txt` because its pose library is unreachable from a runner, so a green
  # exit is not available here and demanding one would only teach people to delete claims.
  # The output is recorded so drift is visible in the log, and `continue-on-error` says that
  # rather than hiding it behind a check mark.
  readme-claims:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: anny corpus
      # Both halves, because no single environment verifies all eleven claims: the schema
      # pair needs `corpus` and the rig measurements need `anny`. One run alone would leave
      # the other half reading as ERROR with nothing saying it was checked elsewhere.
      # `if: always()`, because the first step exits non-zero by design and steps otherwise
      # stop at the first failure -- which would leave the half it does verify unrecorded.
      - run: pixi run -e anny python check_readme_claims.py
      - run: pixi run -e corpus python check_readme_claims.py
        if: always()
      - run: pixi run -e anny python check_readme_claims.py --pose-libraries
        if: always()
